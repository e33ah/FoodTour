name: foodtour-release

on: [workflow_dispatch]

jobs:
  build-and-deploy:
    name: 'Build and Deploy'
    runs-on: windows-latest
    env:
      FtpHost: ${{ secrets.FTP_HOST_PROD }}
      FtpUser: ${{ secrets.FTP_USER_PROD }}
      FtpPassword: ${{ secrets.FTP_PASSWORD_PROD }}
      GoogleClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
      GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FareHarborWebhookKey: ${{ secrets.FAREHARBOR_WEBHOOK_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: 'Run: BuildSolution'
        run: ./build.cmd BuildSolution

      - name: 'Run: ExecuteUnitTests'
        run: ./build.cmd ExecuteUnitTests --skip BuildSolution

      - name: 'Run: Publish'
        run: ./build.cmd Publish --skip BuildSolution ExecuteUnitTests

      - name: 'Run: PatchWebConfig'
        run: ./build.cmd PatchWebConfig --skip BuildSolution ExecuteUnitTests Publish

      - name: 'Run Release'
        run: ./build.cmd Release --skip BuildSolution ExecuteUnitTests Publish PatchWebConfig
