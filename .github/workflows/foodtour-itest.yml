name: foodtour-itest

on: [workflow_dispatch, pull_request]

jobs:
  integration-tests:
    name: 'Build and Run Integration Tests'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: 'Run: BuildSolution'
        run: ./build.cmd BuildSolution

      - name: 'Run: BuildTestSolution'
        run: ./build.cmd BuildTestSolution

      - name: 'Run: ExecuteUnitTests'
        run: ./build.cmd ExecuteUnitTests --skip BuildSolution

      - name: 'Run: IntegrationTests'
        run: ./build.cmd IntegrationTests --skip BuildSolution ExecuteUnitTests BuildTestSolution

      - name: Upload UI failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: foodtour-ui-failure-screenshots
          path: |
            FoodTour.ITest.UI/TestResults/Screenshots/**
          retention-days: 7
          if-no-files-found: ignore
