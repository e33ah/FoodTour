name: foodtour-cd

on: [workflow_dispatch]

jobs:
  build-and-deploy:
    name: 'Build and Deploy'
    runs-on: windows-latest
    env:
      FtpHost: ${{ secrets.FTP_HOST }}
      FtpUser: ${{ secrets.FTP_USER }}
      FtpPassword: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v4
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: 'Run: BuildSolution'
        run: ./build.cmd BuildSolution

      - name: 'Run: ExecuteUnitTests'
        run: ./build.cmd ExecuteUnitTests --skip BuildSolution

      - name: 'Run: Publish'
        run: ./build.cmd Publish --skip BuildSolution ExecuteUnitTests

      - name: 'Run Release'
        run: ./build.cmd Release --skip BuildSolution ExecuteUnitTests Publish
